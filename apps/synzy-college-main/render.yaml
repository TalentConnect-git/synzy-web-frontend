services:
  - type: web
    name: smart-college-finder
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        value: https://college-api.synzy.in/api
      - key: VITE_COLLEGE_PORTAL_URL
        value: https://college.synzy.in
      - key: VITE_MAIN_PORTAL_URL
        value: https://synzy.in
      - key: VITE_SCHOOL_PORTAL_URL
        value: https://school.synzy.in
